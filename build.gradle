plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.parchmentmc.org" }

    %flatmod:maven%
}

configurations {
    indirect {
        extendsFrom configurations.implementation
    }
}

tasks.register("flatmodClasspath") {
    dependsOn configurations.compileClasspath

    // Captured at configuration time — configuration cache safe
    def allFiles = configurations.compileClasspath
    def directFiles = configurations.implementation
    def indirectFiles = configurations.indirect
    def outputFile = layout.projectDirectory.file("fmod-classpath.json")

    doLast {
        def all      = allFiles.files.toSet()
        def direct   = directFiles.files.toSet() - indirectFiles.files.toSet()
        def indirect = indirectFiles.files.toSet()
        def userFiles = direct + indirect

        def gameFiles = all - userFiles
        def mcJar = gameFiles.find { it.name.startsWith("neoforge-") }
                ?: gameFiles.find { it.name.startsWith("client-") }
                ?: gameFiles.first()

        def result = [
                minecraft          : mcJar?.absolutePath ?: "",
                minecraftLibraries : (gameFiles - [mcJar])*.absolutePath,
                direct             : direct*.absolutePath,
                indirect           : indirect*.absolutePath
        ]
        outputFile.asFile.text = groovy.json.JsonOutput.toJson(result)
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_version
    }

    runs {
        configureEach {
            gameDirectory = file("../../../run/")
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.base_name}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file

    // Dependencies
    %flatmod:dependencies%
}

processResources {
    def resourceProperties = project.properties.findAll { key, value ->
        value instanceof String ||
                value instanceof Number ||
                value instanceof Boolean
    }

    inputs.properties resourceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

tasks.named("jar") {
    destinationDirectory = file("../../../dist/")
    archiveFileName = "${project.findProperty('jarName') ?: project.name}.jar"
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}